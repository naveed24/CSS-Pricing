<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main">
    <h1>Our Pricing</h1>

    <div class="billing-options">
      <span>Annually</span>
      <label class="toggle">
        <input type="checkbox" id="billing-toggle" aria-label="Monthly billing">
        <span class="slider"></span>
      </label>
      <span>Monthly</span>
    </div>

    <section class="plans" aria-label="Available pricing plans">
      <article class="basic">
        <h2>Basic</h2>
        <p class="price">
          <span class="annual-price">$199.99</span>
          <span class="monthly-price">$19.99</span>
        </p>
        <hr>
        <p>500 GB Storage</p>
        <hr>
        <p>2 Users Allowed</p>
        <hr>
        <p>Send up to 3 GB</p>
        <hr>
        <button type="button">LEARN MORE</button>
      </article>

      <article class="professional">
        <h2>Professional</h2>
        <p class="price">
          <span class="annual-price">$249.99</span>
          <span class="monthly-price">$24.99</span>
        </p>
        <hr>
        <p>1 TB Storage</p>
        <hr>
        <p>5 Users Allowed</p>
        <hr>
        <p>Send up to 10 GB</p>
        <hr>
        <button type="button">LEARN MORE</button>
      </article>

      <article class="master">
        <h2>Master</h2>
        <p class="price">
          <span class="annual-price">$399.99</span>
          <span class="monthly-price">$39.99</span>
        </p>
        <hr>
        <p>2 TB Storage</p>
        <hr>
        <p>10 Users Allowed</p>
        <hr>
        <p>Send up to 20 GB</p>
        <hr>
        <button type="button">LEARN MORE</button>
      </article>
    </section>
  </main>
</body>
</html>
